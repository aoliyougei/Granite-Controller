services:
  granite-controller:
    build: .
    image: registry.aoliyougei.com/aoliyougei/granite-controller:1.0.0
    env_file: .env
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 4
    restart: unless-stopped

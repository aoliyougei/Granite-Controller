services:
  needle-controller:
    build:
      context: .
    image: needle-controller:0.2.0
    platform: linux/amd64
    ports:
      - "${CONTROLLER_PORT:-8080}:8080"
    environment:
      NEEDLE_API_KEY: "${NEEDLE_API_KEY:?required}"
      NEEDLE_MODEL_ID: "${NEEDLE_MODEL_ID:-needle-2}"
      NEEDLE_MAX_NEW_TOKENS: "${NEEDLE_MAX_NEW_TOKENS:-256}"
      NEEDLE_MAX_QUEUE_DEPTH: "${NEEDLE_MAX_QUEUE_DEPTH:-32}"
      NEEDLE_MAX_REPLAY_STEPS: "${NEEDLE_MAX_REPLAY_STEPS:-32}"
      NEEDLE_BUFFER_SIZE: "${NEEDLE_BUFFER_SIZE:-1048576}"
      NEEDLE_TOOL_INDEX_PATH: "${NEEDLE_TOOL_INDEX_PATH:-}"
      NEEDLE_ENGINE_SLOW_CALL: "${NEEDLE_ENGINE_SLOW_CALL:-30s}"
    healthcheck:
      test: ["CMD", "/needle-controller", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
